<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autotask Webhook Manager</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;background:#f4f6f8;color:#182b3a;margin:0}main{max-width:1100px;margin:auto;padding:28px}a{color:#075dad}nav{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}section,.card{background:white;border:1px solid #d7dfe5;border-radius:8px;padding:22px;margin:20px 0}label{display:block;margin:12px 0 4px}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:10px;border:1px solid #a8b6c2;border-radius:4px;font:inherit}button{background:#075dad;color:white;border:0;border-radius:4px;padding:10px 16px;margin:14px 8px 0 0;cursor:pointer;font:inherit}button.danger{background:#a82525}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #d7dfe5;padding:12px;text-align:left}input[type=checkbox]{width:20px;height:20px}.message{padding:16px;background:#e1f1e5;white-space:pre-line}.error{background:#ffe3e3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.actions{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.scroll{overflow-x:auto}small{color:#526575}
</style></head><body><main>
<h1>Autotask Webhook Manager</h1>
<nav><a href="{{ url_for('credentials.index') }}">Credentials</a>{% for type in ['company','ticket','contact'] %}<a href="{{ url_for('webhook.index',type=type) }}">{{ type|capitalize }} webhooks</a>{% endfor %}</nav>
{% for message in get_flashed_messages() %}<p class="message" role="status">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
