{% extends 'base.html' %}{% block content %}
<section><h2>API credentials</h2><form method="post">
<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
<label for="apiUser">API username</label><input id="apiUser" name="apiUser" value="{{ credentials.get('apiUser','') }}" required>
<label for="apiSecret">API secret</label><input id="apiSecret" name="apiSecret" type="password" autocomplete="new-password" placeholder="{{ 'Saved — leave blank to keep' if credentials.get('apiSecret') else 'API secret' }}" {% if not credentials.get('apiSecret') %}required{% endif %}>
<label for="integrationCode">Integration code</label><input id="integrationCode" name="integrationCode" value="{{ credentials.get('integrationCode','') }}" required>
<label for="baseUrl">Autotask API base URL</label><input id="baseUrl" name="baseUrl" type="url" value="{{ credentials.get('baseUrl','') }}" required>
<label for="webhookUrl">Default webhook URL (optional)</label><input id="webhookUrl" name="webhookUrl" type="url" value="{{ credentials.get('webhookUrl','') }}">
<button name="action" value="save">Save credentials</button><button name="action" value="test">Test credentials</button>
</form><p><small>Credentials are saved in Codex/creds.json. Environment settings take precedence when loading saved credentials.</small></p></section>
{% endblock %}
