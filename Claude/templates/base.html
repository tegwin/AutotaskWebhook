<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Autotask Webhook Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        input.form-check-input { border: 1px solid #000; }
    </style>
</head>
<body class="container py-4">

<nav class="mb-4 d-flex gap-2">
    <a href="{{ url_for('credentials') }}" class="btn btn-outline-secondary btn-sm">Credentials</a>
    <a href="{{ url_for('webhooks', type='company') }}" class="btn btn-outline-secondary btn-sm">Manage Webhooks</a>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
{% endwith %}

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
