{% extends "base.html" %}
{% block title %}Autotask API Credentials{% endblock %}

{% block content %}
<h3 class="mb-3">Autotask API Credentials</h3>
<p class="text-muted">Saved to <code>creds.json</code> so you only enter them once. Defaults come from <code>.env</code>.</p>

<form method="post" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-6">
        <label class="form-label">API User</label>
        <input type="text" name="api_user" class="form-control" required value="{{ creds.api_user }}">
    </div>
    <div class="col-md-6">
        <label class="form-label">API Secret</label>
        <input type="password" name="api_secret" class="form-control" required value="{{ creds.api_secret }}">
    </div>
    <div class="col-md-6">
        <label class="form-label">Integration Code</label>
        <input type="text" name="integration_code" class="form-control" required value="{{ creds.integration_code }}">
    </div>
    <div class="col-md-6">
        <label class="form-label">Base URL</label>
        <input type="text" name="base_url" class="form-control" required value="{{ creds.base_url }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">Webhook URL</label>
        <input type="text" name="webhook_url" class="form-control" value="{{ creds.webhook_url }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">Notification Email</label>
        <input type="email" name="notification_email" class="form-control" value="{{ creds.notification_email }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">Webhook Name</label>
        <input type="text" name="webhook_name" class="form-control" value="{{ creds.webhook_name }}">
    </div>

    <div class="col-12">
        <button type="submit" name="save_credentials" value="1" class="btn btn-primary">Save &amp; Continue</button>
        <button type="submit" name="test_connection" value="1" class="btn btn-secondary">Test Connection</button>
        <a href="{{ url_for('webhooks', type='company') }}" class="btn btn-success ms-2">Manage Webhooks</a>
    </div>
</form>
{% endblock %}
